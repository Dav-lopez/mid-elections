name: CivicPulse quality checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app.py civicpulse_core.py civicpulse_client.py civicpulse_registry.py civicpulse_map.py civicpulse_explorer.py civicpulse_polling.py civicpulse_disk_cache.py civicpulse_source_audit.py scripts/monitor_deployment.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Start headless Streamlit and check server health
        shell: bash
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless=true --server.port=8501 > /tmp/civicpulse-streamlit.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health | grep -q 'ok'; then
              echo "Streamlit server health check passed"
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/civicpulse-streamlit.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/civicpulse-streamlit.log
          exit 1

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium
      - name: Test desktop and mobile in real Chromium against empty local feed
        run: python scripts/browser_smoke.py
      - name: Upload synthetic-fixture screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civicpulse-browser-smoke
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
