name: CivicPulse independent source and deployment monitor

# This is an independent read-only probe; it does not run inside Streamlit,
# inspect vote totals, or assert that every race is covered.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civicpulse-source-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Configure site URL after deployment in Settings > Secrets and variables
      # > Actions > Variables. An empty value skips only the site check.
      CIVICPULSE_SITE_URL: ${{ vars.CIVICPULSE_SITE_URL }}
      ELECTION_RESULTS_URL: ${{ vars.ELECTION_RESULTS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check independent House/Senate source contract and site readiness
        run: python -m scripts.monitor_deployment
