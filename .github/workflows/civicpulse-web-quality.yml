name: CivicPulse web quality

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/civicpulse-web-quality.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/civicpulse-web-quality.yml"

permissions:
  contents: read

jobs:
  nextjs-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Probe civicAPI response contract (non-blocking)\n        run: node scripts/probe-civicapi.mjs\n      - name: Reported-result regression tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: TypeScript verification
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
